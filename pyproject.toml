[project]
name = "freefood"
version = "0.1.0"
description = "Near-real-time free food and free event finder for Yale's campus, built on Yale Connect (CampusGroups)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "apscheduler>=3.10,<4",
    "fastapi>=0.115",
    "httpx>=0.27",
    "icalendar>=6.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "sqlalchemy>=2.0.30",
    "tzdata>=2024.1",
    "uvicorn>=0.30",
]

[project.scripts]
app = "app.main:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-socket>=0.7",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --disable-socket --allow-unix-socket"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ERA"]
ignore = ["E501"]
